[package]
name = "tessera-app"
description = "Tessera: a shared island that repairs itself around every brush stroke, on autumn-web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "tessera-app"

[dependencies]
tessera = { path = "../tessera" }
anyhow = { workspace = true }
autumn-web = { workspace = true }
maud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
autumn-web = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true
